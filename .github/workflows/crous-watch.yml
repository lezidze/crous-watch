name: crous-watch

on:
  schedule:
    - cron: "2-59/5 * * * *"   # каждые 5 минут, мимо загруженного начала часа
  workflow_dispatch:            # кнопка ручного запуска

permissions:
  contents: write               # чтобы коммитить state.json

concurrency:
  group: crous-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check CROUS
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CROUS_URL: ${{ vars.CROUS_URL }}
        run: python crous_watch.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "state: update offers"
            git pull --rebase --autostash
            git push
          fi
